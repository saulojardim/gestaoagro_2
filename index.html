<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rebanho">
<meta name="theme-color" content="#1F5130">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Gestão do Rebanho</title>
<style>
  :root{
    --verde:#2E8B4F;         /* verde de acento (ícones, títulos de seção) */
    --verde-esc:#1F5130;     /* verde escuro (hero, texto forte) */
    --verde-med:#3AA05C;
    --verde-lite:#E8F3EA;    /* fundo claro dos módulos/ícones */
    --verde-lite2:#DCEEDF;
    --fundo:#F6F8F6;
    --card:#FFFFFF;
    --texto:#1A1D1A;
    --muted:#7C837C;
    --linha:#E6EAE6;
    --perigo:#B4432E;
    --sombra:0 1px 3px rgba(20,40,25,.06),0 1px 2px rgba(20,40,25,.04);
    --radius:16px;
    --nav-h:66px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{background:var(--fundo);min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fundo);color:var(--texto);font-size:16px;line-height:1.4;
    min-height:100vh;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Topo ---------- */
  .topo{
    background:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:grid;
    grid-template-columns:44px 1fr 44px;
    align-items:center;
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--linha);
  }
  .topo .icobtn{
    width:44px;height:44px;border-radius:12px;background:none;color:var(--verde-esc);font-size:22px;
    display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
  }
  .topo .tit{text-align:center;}
  .topo .tit h1{margin:0;font-size:19px;font-weight:800;color:var(--verde-esc);}
  .topo .tit .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .topo .mais{
    width:44px;height:44px;border-radius:50%;background:var(--verde);color:#fff;font-size:26px;
    box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
  }
  .topo .mais:active{background:var(--verde-med);}

  main{max-width:660px;margin:0 auto;padding:16px 14px 8px;overflow-x:hidden;}
  #tela > *{animation:telaIn .17s ease-out both;}
  @keyframes telaIn{from{opacity:0}to{opacity:1}}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(135deg,#245e38 0%,#1c4a2c 55%,#173f26 100%);
    border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sombra);
    margin-bottom:22px;
  }
  .hero .cattle{position:absolute;right:-10px;bottom:-14px;opacity:.16;width:180px;height:auto;}
  .hero .cabeca{display:flex;align-items:center;gap:12px;}
  .hero .tile{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;}
  .hero .rot{font-size:15px;font-weight:600;opacity:.95;}
  .hero .num{font-size:52px;font-weight:800;line-height:1;margin:6px 0 2px;}
  .hero .peq{font-size:14px;opacity:.85;}
  .hero .linha{display:flex;align-items:center;gap:14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;}
  .hero .frase{font-size:12.5px;opacity:.9;line-height:1.5;}
  .hero .assinatura{position:absolute;right:18px;top:16px;font-style:italic;font-size:13px;opacity:.85;text-align:right;max-width:120px;}

  /* ---------- Seções ---------- */
  .sechead{display:flex;align-items:center;gap:8px;margin:0 4px 12px;}
  .sechead .sic{color:var(--verde);font-size:20px;}
  .sechead h2{margin:0;font-size:19px;font-weight:800;color:var(--verde-esc);flex:1;}
  .sechead a{color:var(--verde);font-size:14px;font-weight:600;text-decoration:none;}

  /* ---------- Cartão de propriedade ---------- */
  .prop{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:12px;margin-bottom:12px;cursor:pointer;}
  .prop:active{background:#fafbfa;}
  .prop .top{display:flex;gap:12px;align-items:center;}
  .prop .thumb{width:80px;height:64px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(160deg,#cfe6d4,#a9d3b3);display:flex;align-items:center;justify-content:center;color:#2c6b41;overflow:hidden;}
  .prop .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .prop-foto-wrap{position:relative;width:92px;height:78px;flex-shrink:0;cursor:pointer;}
  .prop-foto{width:92px;height:78px;border-radius:14px;background:linear-gradient(160deg,#cfe6d4,#a9d3b3);
    display:flex;align-items:center;justify-content:center;color:#2c6b41;font-size:30px;overflow:hidden;}
  .prop-foto img{width:100%;height:100%;object-fit:cover;display:block;}
  .prop-foto-cam{position:absolute;right:-5px;bottom:-5px;width:28px;height:28px;border-radius:50%;
    background:var(--verde);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;box-shadow:var(--sombra);}
  .prop .nome{font-size:18px;font-weight:700;color:var(--verde-esc);}
  .prop .loc{font-size:13px;color:var(--muted);margin-top:2px;}
  .prop .chev{color:var(--muted);font-size:20px;}
  .prop .stats{display:flex;align-items:stretch;gap:12px;background:#f4f8f4;border-radius:12px;padding:10px 12px;margin-top:10px;}
  .prop .stats .tot{padding-right:12px;border-right:1px solid var(--linha);}
  .prop .stats .lbl{font-size:11px;color:var(--muted);}
  .prop .stats .big{font-size:24px;font-weight:800;color:var(--verde-esc);}
  .prop .marcas{display:flex;gap:16px;flex:1;}
  .prop .marcas .m{text-align:center;}
  .prop .marcas .ms{font-size:11px;color:var(--muted);font-weight:700;}
  .prop .marcas .mn{font-size:18px;font-weight:800;color:var(--verde-esc);}

  /* ---------- Módulos ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mod-list{display:flex;flex-direction:column;gap:22px;margin-bottom:6px;}
  .filtros-animais{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .filtros-animais select{font-size:15px;padding:10px 12px;}
  .mod{background:var(--verde-lite);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative;}
  .mod:active{background:var(--verde-lite2);}
  .mod .mic{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    color:var(--verde);font-size:22px;margin-bottom:10px;box-shadow:var(--sombra);}
  .mod .mt{font-weight:700;color:var(--verde-esc);font-size:15px;}
  .mod .md{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .mod .chev{position:absolute;right:12px;top:14px;color:var(--verde);opacity:.6;}

  .faixa{background:#eef4ef;border-radius:var(--radius);padding:14px 16px;margin-top:18px;display:flex;align-items:center;gap:12px;}
  .faixa .fic{color:var(--verde);font-size:22px;}
  .faixa .ft{font-size:13.5px;color:#3a4a3d;line-height:1.4;}

  /* ---------- Listas genéricas ---------- */
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rt{cursor:pointer;} .rt:active{background:#fafbfa;}
  .ti{font-weight:600;font-size:16px;} .meta{color:var(--muted);font-size:13px;margin-top:2px;}
  .badge{background:var(--verde);color:#fff;font-size:13px;font-weight:600;border-radius:20px;padding:3px 11px;white-space:nowrap;}
  .chip{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;margin-right:4px;line-height:1;vertical-align:middle;}
  .chip-lote{background:var(--verde-lite);color:var(--verde-esc);}
  .chip-f{background:#fbe9ef;color:#a13a63;} .chip-m{background:#e6eef6;color:#2f6fa8;}
  .chip-off{background:#eee;color:#777;} .chip-marca{background:#fff4d6;color:#8a6a12;}
  .chip-id{background:#eef2ef;color:#5a6b5e;}
  .avatar{width:64px;height:64px;border-radius:50%;background:var(--verde-lite);color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar-wrap{position:relative;width:64px;height:64px;flex-shrink:0;cursor:pointer;}
  .avatar-cam{position:absolute;right:-3px;bottom:-3px;width:25px;height:25px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;}
  .an-thumb{border-radius:10px;background:var(--verde-lite);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:18px;}
  .an-thumb img{width:100%;height:100%;object-fit:cover;}
  .fintabs{display:flex;gap:6px;margin:2px 0 14px;overflow-x:auto;}
  .fintabs button{flex:1;min-width:82px;padding:9px 6px;border:1.5px solid var(--linha);border-radius:10px;background:#fff;color:var(--muted);font-weight:600;font-size:13px;}
  .fintabs button.on{background:var(--verde);color:#fff;border-color:var(--verde);}
  .fin-hero{background:var(--verde-esc);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px;}
  .fin-hero .lbl{opacity:.85;font-size:13px;} .fin-hero .num{font-size:32px;font-weight:800;margin-top:2px;}
  .fin-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .fin-c{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px;}
  .fin-c .cl{font-size:12px;color:var(--muted);} .fin-c .cv{font-size:17px;font-weight:800;margin-top:3px;}
  .fchart{display:flex;gap:3px;align-items:flex-end;height:130px;padding:6px 2px 0;}
  .fcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .fbars{display:flex;gap:1px;align-items:flex-end;height:100px;}
  .fbar{width:6px;border-radius:2px 2px 0 0;min-height:1px;}
  .fbar.rec{background:#4c9a5f;} .fbar.desp{background:var(--verde-esc);}
  .flbl{font-size:9px;color:var(--muted);}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9999;padding:18px;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;}
  .lightbox .lb-x{position:absolute;top:16px;right:18px;color:#fff;font-size:26px;opacity:.85;}
  .voltar{background:none;color:var(--verde-esc);font-weight:600;font-size:15px;padding:0;margin:2px 0 12px;}
  .h3{margin:18px 4px 10px;font-size:15px;color:var(--muted);font-weight:700;}
  .evt{border-left:3px solid var(--verde);padding:2px 0 12px 12px;margin-left:4px;}
  .evt:last-child{padding-bottom:0;}
  .evt .tp{font-weight:600;font-size:15px;} .evt .dt{color:var(--muted);font-size:12px;} .evt .de{font-size:14px;margin-top:2px;}
  .vazio{text-align:center;color:var(--muted);padding:36px 20px;} .vazio .big{font-size:34px;margin-bottom:8px;}

  /* ---------- Botões ---------- */
  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;}
  .btn{display:block;width:100%;background:var(--verde);color:#fff;padding:14px;border-radius:14px;font-weight:600;margin-bottom:10px;box-shadow:var(--sombra);}
  .btn:active{background:var(--verde-med);}
  .btn-sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde);box-shadow:none;}
  .btn-perigo{background:#fff;color:var(--perigo);border:1.5px solid var(--perigo);box-shadow:none;}
  .btn-fant{background:none;color:var(--muted);padding:10px;box-shadow:none;}
  .lado{display:flex;gap:12px;} .lado .btn{margin-bottom:0;}
  .animal-actions{margin-top:18px;margin-bottom:22px;}
  .animal-actions > .btn{margin-bottom:14px;}
  .animal-actions .lado{margin-bottom:12px;}
  .animal-actions .lado + .btn{margin-bottom:0;}
  .animal-saida{margin-top:4px;margin-bottom:28px;}
  .manejo-hist{margin-top:26px;}
  .manejo-sec{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:14px;margin-bottom:14px;}
  .manejo-sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .manejo-sec-title{font-size:16px;font-weight:800;color:var(--verde-esc);}
  .manejo-count{font-size:12px;color:var(--muted);font-weight:700;background:#f1f5f1;border-radius:20px;padding:3px 9px;}
  .manejo-reg{padding:10px 0;border-top:1px solid var(--linha);}
  .manejo-reg:first-of-type{border-top:0;padding-top:2px;}
  .manejo-reg .mr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .manejo-reg .mr-title{font-weight:700;color:var(--texto);font-size:14px;}
  .manejo-reg .mr-date{font-size:12px;color:var(--muted);white-space:nowrap;}
  .manejo-reg .mr-meta{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4;}

  /* ---------- Modal ---------- */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .ov.on{display:flex;}
  .modal{background:#fff;width:100%;max-width:660px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:sobe .18s ease;}
  @keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 12px;font-size:18px;color:var(--verde-esc);}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
  input,select,textarea{width:100%;min-width:0;padding:12px;border:1.5px solid var(--linha);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--texto);}
  input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0;text-align:left;}
  input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left;margin:0;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde);}
  textarea{resize:vertical;min-height:60px;}
  .sheet-item{padding:15px 4px;border-bottom:1px solid var(--linha);font-size:16px;display:flex;gap:12px;align-items:center;}
  .sheet-item:last-child{border-bottom:none;} .sheet-item .si{color:var(--verde);font-size:20px;width:24px;text-align:center;}

  /* ---------- Nav ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--linha);display:flex;z-index:30;box-shadow:0 -2px 10px rgba(20,40,25,.05);}
  nav button{flex:1;background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  nav button .ic{font-size:21px;line-height:1;} nav button.ativo{color:var(--verde);}
  .tile img{width:46px;height:46px;object-fit:contain;display:block;}
  .mic img{width:38px;height:38px;object-fit:contain;display:block;}
  nav .ic img{width:28px;height:24px;object-fit:contain;display:inline-block;vertical-align:middle;}
</style>
</head>
<body>

<div class="topo">
  <button class="icobtn" onclick="menuConfig()">☰</button>
  <div class="tit"><h1>Gestão do Rebanho</h1></div>
  <button class="mais" onclick="menuAdicionar()">+</button>
</div>

<main id="tela"></main>

<nav>
  <button data-aba="painel" class="ativo"><span class="ic">⌂</span>Painel</button>
  <button data-aba="lotes"><span class="ic">▤</span>Lotes</button>
  <button data-aba="animais"><span class="ic"><img src="boi.png" alt=""></span>Animais</button>
  <button data-aba="perfil"><span class="ic">◔</span>Perfil</button>
</nav>

<div class="ov" id="ov"><div class="modal" id="md"></div></div>

<script>
/* ======================= BANCO (IndexedDB, offline) ======================= */
const DB="rebanho_v2"; let db;
function abrirDB(){return new Promise((ok,er)=>{const r=indexedDB.open(DB,6);
  r.onupgradeneeded=e=>{const d=e.target.result;
    const criar=n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"});};
    criar("propriedades"); criar("marcas"); criar("lotes");
    criar("animais"); criar("eventos"); criar("medicamentos"); criar("perfil"); criar("pastos");
    criar("avisos"); criar("lancamentos");
  };
  r.onsuccess=e=>{db=e.target.result;ok();}; r.onerror=er;});}
function tx(s,m="readonly"){return db.transaction(s,m).objectStore(s);}
function getAll(s){return new Promise(ok=>{const r=tx(s).getAll();r.onsuccess=()=>ok(r.result);});}
function get(s,id){return new Promise(ok=>{const r=tx(s).get(id);r.onsuccess=()=>ok(r.result);});}
function put(s,o){return new Promise(ok=>{const r=tx(s,"readwrite").put(o);r.onsuccess=()=>ok(o);});}
function del(s,id){return new Promise(ok=>{const r=tx(s,"readwrite").delete(id);r.onsuccess=()=>ok();});}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const codAnimal=a=>"#"+String((a&&a.codigo)||0).padStart(3,'0');
const rotulo=a=>(a&&(a.brinco||a.nome))||codAnimal(a);
async function proximoCodigo(){const as=await getAll("animais");return as.reduce((m,a)=>Math.max(m,a.codigo||0),0)+1;}
const numBR=id=>{let v=val(id);if(!v)return null;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isNaN(n)?null:n;};
const moeda=n=>n==null?"—":n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');};
const horaAgora=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');};
const fmt=d=>{if(!d)return"";const[a,m,x]=d.split("-");return`${x}/${m}/${a}`;};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=id=>(document.getElementById(id).value||"").trim();
const TIPOS=["Vacinação","Medicamento","Marcação","Nascimento","Movimentação","Pesagem","Tratamento","Reprodução","Morte","Venda","Outro"];
const VIAS=["Injeção","Pour on","Spray","Brinco","Ingestão","Outro"];
const TIPOS_AVISO=["Comprar produto","Contratar serviço","Manejo","Outro"];
const ICONE_AVISO={"Comprar produto":"🛒","Contratar serviço":"🧰","Manejo":"🐄","Outro":"🔔"};
const CAT_RECEITA=["Venda de animais","Venda de bezerro","Venda de matriz/descarte","Leite","Arrendamento","Outros"];
const CAT_DESPESA=["Sanidade (vacina/remédio)","Alimentação (sal/ração)","Pasto (semente/adubo/herbicida)","Mão de obra","Combustível","Manutenção (cerca/máquina)","Veterinário","Impostos/taxas","Frete","Outros"];
const MESES_ABREV=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const TIPOS_MED=["Vacina","Antibiótico","Vermífugo","Anti-inflamatório","Carrapaticida/Mosquicida","Vitamina/Mineral","Hormônio","Outro"];
const optTipoMed=sel=>TIPOS_MED.map(t=>`<option value="${t}" ${t===sel?"selected":""}>${t}</option>`).join("");
const svgMacho=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2f7bef" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="14.5" r="6"/><line x1="13.8" y1="10.2" x2="20" y2="4"/><polyline points="14.5 4 20 4 20 9.5"/></svg>`;
const svgFemea=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e24fa0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><line x1="12" y1="15" x2="12" y2="22"/><line x1="8.5" y1="18.5" x2="15.5" y2="18.5"/></svg>`;
const sexoChip=s=>s==="F"?`<span class="chip chip-f">${svgFemea}</span>`:`<span class="chip chip-m">${svgMacho}</span>`;

/* Carrega tudo de uma vez e monta em memória */
async function tudo(){
  const [propriedades,marcas,lotes,animais,eventos,medicamentos,pastos]=await Promise.all(
    ["propriedades","marcas","lotes","animais","eventos","medicamentos","pastos"].map(getAll));
  return {propriedades,marcas,lotes,animais,eventos,medicamentos,pastos};
}
const propDoAnimal=(a,lotes)=>{const l=lotes.find(x=>x.id===a.loteAtualId);return l?l.propriedadeId:null;};

/* ======================= AÇÕES ======================= */
async function registrarEvento(animalId,tipo,data,detalhes,extra){
  const a=await get("animais",animalId);
  const ev=Object.assign({id:uid(),animalId,tipo,data:data||hoje(),detalhes:detalhes||"",criadoEm:Date.now()}, extra||{});
  await put("eventos",ev);
  if(a&&(tipo==="Morte"||tipo==="Venda")){a.status=tipo==="Morte"?"Morto":"Vendido";await put("animais",a);}
}
async function excluirEvento(eventoId,animalId){
  if(!confirm("Excluir este registro do histórico?"))return;
  const ev=await get("eventos",eventoId);
  await del("eventos",eventoId);
  // se era registro de saída (morte/venda) e não sobrou outro, reativa o animal
  if(ev&&(ev.tipo==="Morte"||ev.tipo==="Venda")){
    const restantes=(await getAll("eventos")).filter(e=>e.animalId===animalId&&(e.tipo==="Morte"||e.tipo==="Venda"));
    if(!restantes.length){const a=await get("animais",animalId);if(a){a.status="Ativo";delete a.saida;await put("animais",a);}}
  }
  verAnimal(animalId);
}
async function moverAnimal(id,novoLote){
  const a=await get("animais",id),de=await get("lotes",a.loteAtualId),para=await get("lotes",novoLote);
  a.loteAtualId=novoLote;await put("animais",a);
  await registrarEvento(id,"Movimentação",hoje(),`De "${de?de.nome:"—"}" para "${para?para.nome:"—"}"`);
}

/* ---------- Helpers de datas e histórico ---------- */
// Dias inteiros entre dois instantes (fim = agora, se não informado)
const diasEntre=(ini,fim)=>{if(!ini)return 0;return Math.max(0,Math.floor(((fim||Date.now())-ini)/86400000));};
// Timestamp -> "AAAA-MM-DD" no fuso local (compatível com fmt())
const tsData=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');};
// Lista com "Ver mais": mostra os 10 primeiros; o resto abre ao tocar.
let _vmN=0;
function verMais(itens,rotulo){
  if(!itens||!itens.length)return"";
  if(itens.length<=10)return itens.join("");
  const id="vm"+(++_vmN);
  return itens.slice(0,10).join("")
    +`<div id="${id}" style="display:none">${itens.slice(10).join("")}</div>`
    +`<button class="btn btn-sec" style="margin-top:10px" onclick="var e=document.getElementById('${id}');e.style.display='block';this.remove();">Ver mais ${itens.length-10}${rotulo?" "+rotulo:""}</button>`;
}

/* ---------- Histórico de situação do pasto ---------- */
// Reconstrói os períodos (fechados + o período atual em aberto)
function periodosPasto(pt){
  const hist=(pt.historico||[]).map(p=>({...p}));
  const aberto={status:pt.status||"Livre",inicio:pt.statusDesde||pt.criadoEm||Date.now(),fim:null,loteId:pt.loteId||null};
  return [...hist,aberto];
}
// Soma de dias por situação
function resumoPasto(pt){
  const d={Descanso:0,Ocupado:0,Livre:0};
  for(const p of periodosPasto(pt))d[p.status]=(d[p.status]||0)+diasEntre(p.inicio,p.fim);
  return d;
}
// Outros eventos registráveis no pasto (herbicida, roçada, etc.)
const PASTO_EVENTOS=["Herbicida","Roçada","Adubação","Calagem","Reforma / Plantio","Limpeza de cerca","Análise de solo","Outro"];
const ICONE_PASTO_EV={"Herbicida":"🧪","Roçada":"🌾","Adubação":"🌿","Calagem":"⚪","Reforma / Plantio":"🌱","Limpeza de cerca":"🚧","Análise de solo":"🔬","Outro":"📌"};
// "AAAA-MM-DD" -> timestamp local ao meio-dia (evita erro de fuso)
const dataParaTs=s=>{if(!s)return null;const[a,m,d]=s.split("-").map(Number);return new Date(a,(m||1)-1,d||1,12,0,0).getTime();};
// ---------- Desmama ----------
const DIAS_DESMAMA=210;
function desmamaInfo(a){
  if(a.desmamado)return {desmamado:true,dataDesmama:a.dataDesmama||""};
  if(!a.dataNascimento)return {desmamado:false,semData:true};
  const idade=diasEntre(dataParaTs(a.dataNascimento),Date.now());
  return {desmamado:false,idadeDias:idade,diasRestantes:DIAS_DESMAMA-idade};
}
function desmamaLabel(a){
  const d=desmamaInfo(a);
  if(d.desmamado)return `✅ Desmamado${d.dataDesmama?` em ${fmt(d.dataDesmama)}`:""}`;
  if(d.semData)return `🍼 Desmama: informe a data de nascimento`;
  if(d.diasRestantes>0)return `🍼 Desmama em ${d.diasRestantes} dia(s)`;
  if(d.diasRestantes===0)return `🍼 Desmama é hoje!`;
  return `⚠️ Desmama atrasada há ${-d.diasRestantes} dia(s)`;
}

async function formDesmama(animalId){
  const {animais}=await tudo();
  if(animalId){
    const a=animais.find(x=>x.id===animalId);if(!a){fechar();return;}
    const corrigindo=a.desmamado;
    const dataInicial=(corrigindo&&a.dataDesmama)?a.dataDesmama:hoje();
    abrir(`<h2>${corrigindo?"Corrigir data da desmama":"Registrar desmama"}</h2>
      <div class="meta" style="margin-bottom:10px"><b>${esc(rotulo(a))}</b> ${codAnimal(a)}${a.dataNascimento?` · nasc. ${fmt(a.dataNascimento)}`:""}</div>
      <label>Data da desmama</label><input id="dm_data" type="date" value="${dataInicial}">
      <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
        <button class="btn" onclick="salvarDesmama('${animalId}')">Salvar</button></div>`);
    return;
  }
  const naoDesmamados=animais.filter(a=>a.nascidoNaPropriedade===true&&!a.desmamado).sort((x,y)=>(x.codigo||0)-(y.codigo||0));
  if(!naoDesmamados.length){
    abrir(`<h2>Registrar desmama</h2><div class="meta">Todos os bezerros já estão desmamados. 🎉</div>
      <button class="btn btn-sec" style="margin-top:14px" onclick="fechar()">Fechar</button>`);return;
  }
  const opt=naoDesmamados.map(a=>`<option value="${a.id}">${esc(rotulo(a))} ${codAnimal(a)}</option>`).join("");
  abrir(`<h2>Registrar desmama</h2>
    <label>Bezerro *</label><select id="dm_animal">${opt}</select>
    <label>Data da desmama</label><input id="dm_data" type="date" value="${hoje()}">
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarDesmama()">Salvar</button></div>`);
}
async function salvarDesmama(animalId){
  const id=animalId||(document.getElementById("dm_animal")||{}).value;
  if(!id)return alert("Selecione o bezerro.");
  const a=await get("animais",id);if(!a)return;
  const jaEra=a.desmamado;
  a.desmamado=true;a.dataDesmama=val("dm_data")||hoje();
  await put("animais",a);
  if(jaEra){
    const evs=(await getAll("eventos")).filter(e=>e.animalId===id&&e.tipo==="Desmama");
    if(evs.length){const ev=evs[0];ev.data=a.dataDesmama;await put("eventos",ev);}
  }else{
    await registrarEvento(id,"Desmama",a.dataDesmama,"Bezerro desmamado");
  }
  fechar();telaNascimentos();
}
async function desfazerDesmama(animalId){
  if(!confirm("Desfazer a desmama deste bezerro?"))return;
  const a=await get("animais",animalId);if(!a)return;
  a.desmamado=false;a.dataDesmama="";
  await put("animais",a);
  const evs=(await getAll("eventos")).filter(e=>e.animalId===animalId&&e.tipo==="Desmama");
  for(const ev of evs)await del("eventos",ev.id);
  telaNascimentos();
}

  if(!pt){telaGestaoPasto();return;}
  const {propriedades,lotes}=await tudo();
  const nomeLote=lid=>(lotes.find(l=>l.id===lid)||{}).nome||"—";
  const nomeProp=pid=>(propriedades.find(p=>p.id===pid)||{}).nome||"Sem propriedade";
  const r=resumoPasto(pt);
  const rot={Descanso:["🌿","Em descanso"],Ocupado:["🐄","Ocupado"],Livre:["⬜","Livre"]};
  // junta situações (períodos) + outros eventos, do mais recente ao mais antigo
  const entradas=[];
  (pt.historico||[]).forEach((p,i)=>entradas.push({kind:"per",ref:String(i),status:p.status,inicio:p.inicio,fim:p.fim,loteId:p.loteId,ordena:p.inicio||0}));
  entradas.push({kind:"per",ref:"atual",status:pt.status||"Livre",inicio:pt.statusDesde||pt.criadoEm||Date.now(),fim:null,loteId:pt.loteId||null,ordena:pt.statusDesde||pt.criadoEm||0});
  (pt.manejos||[]).forEach(m=>entradas.push({kind:"man",ref:m.id,tipo:m.tipo,data:m.data,obs:m.obs,ordena:dataParaTs(m.data)||0}));
  entradas.sort((a,b)=>b.ordena-a.ordena);
  const bE=fn=>`<button class="btn-fant" style="padding:2px 6px;color:var(--verde)" onclick="${fn}">✎</button>`;
  const bX=fn=>`<button class="btn-fant" style="padding:2px 6px;color:var(--perigo)" onclick="${fn}">✕</button>`;
  const itens=entradas.map(e=>{
    if(e.kind==="per"){
      const [ic,txt]=rot[e.status]||rot.Livre;
      const fimTxt=e.fim?fmt(tsData(e.fim)):"agora";
      const dias=diasEntre(e.inicio,e.fim);
      const loteTxt=(e.status==="Ocupado"&&e.loteId)?`▦ ${esc(nomeLote(e.loteId))}`:"";
      const ctrl=bE(`editarPeriodoPasto('${id}','${e.ref}')`)+(e.ref!=="atual"?bX(`excluirPeriodoPasto('${id}','${e.ref}')`):"");
      return `<div class="evt"><div class="row"><div class="tp">${ic} ${txt}</div><div style="white-space:nowrap">${ctrl}</div></div>
        <div class="dt">${fmt(tsData(e.inicio))} → ${fimTxt} · ${dias} dia(s)</div>${loteTxt?`<div class="de">${loteTxt}</div>`:""}</div>`;
    }else{
      const ic=ICONE_PASTO_EV[e.tipo]||"📌";
      const ctrl=bE(`formEventoPasto('${id}','${e.ref}')`)+bX(`excluirEventoPasto('${id}','${e.ref}')`);
      return `<div class="evt"><div class="row"><div class="tp">${ic} ${esc(e.tipo)}</div><div style="white-space:nowrap">${ctrl}</div></div>
        <div class="dt">${e.data?fmt(e.data):"—"}</div>${e.obs?`<div class="de">${esc(e.obs)}</div>`:""}</div>`;
    }
  });
  $t.innerHTML=`<button class="voltar" onclick="telaGestaoPasto()">‹ Gestão do Pasto</button>
    <div class="card"><div class="ti" style="font-size:19px">🌱 ${esc(pt.nome)}</div>
      <div class="meta">${esc(nomeProp(pt.propriedadeId))}${[pt.areaHa!=null?" · "+pt.areaHa+" ha":"",pt.tipoCapim?" · "+esc(pt.tipoCapim):""].join("")}</div>
      <div class="meta" style="margin-top:8px">${pastoStatusChip(pt)}${pt.status==="Ocupado"&&pt.loteId?`<span class="chip chip-lote">▦ ${esc(nomeLote(pt.loteId))}</span>`:""}</div></div>
    <div class="grid">
      <div class="card" style="text-align:center"><div style="font-size:30px;font-weight:800;color:var(--verde)">${r.Descanso}</div><div class="meta">dia(s) reservado<br>(em descanso)</div></div>
      <div class="card" style="text-align:center"><div style="font-size:30px;font-weight:800;color:var(--verde-esc)">${r.Ocupado}</div><div class="meta">dia(s) ocupado</div></div>
    </div>
    <button class="btn btn-sec" onclick="formEventoPasto('${id}')">+ Registrar evento no pasto</button>
    <div class="h3">Histórico</div>
    ${itens.length?verMais(itens,"registro(s)"):`<div class="meta">Sem registros ainda.</div>`}`;
}
/* ---------- Eventos do pasto (herbicida, roçada, etc.) ---------- */
async function formEventoPasto(pastoId,eventoId){
  const pt=await get("pastos",pastoId);
  const ev=(eventoId&&(pt.manejos||[]).find(m=>m.id===eventoId))||null;
  const optTipo=PASTO_EVENTOS.map((t,i)=>`<option value="${esc(t)}" ${ev?(ev.tipo===t?"selected":""):(i===0?"selected":"")}>${ICONE_PASTO_EV[t]||""} ${t}</option>`).join("");
  abrir(`<h2>${ev?"Editar evento":"Registrar evento no pasto"}</h2>
    <label>Tipo *</label><select id="ep_tipo">${optTipo}</select>
    <label>Data</label><input id="ep_data" type="date" value="${ev?ev.data:hoje()}">
    <label>Observação (opcional)</label><input id="ep_obs" value="${ev?esc(ev.obs||""):""}" placeholder="Ex: produto, dose, área…">
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarEventoPasto('${pastoId}'${eventoId?`,'${eventoId}'`:""})">Salvar</button></div>`);
}
async function salvarEventoPasto(pastoId,eventoId){
  const pt=await get("pastos",pastoId);
  if(!pt.manejos)pt.manejos=[];
  const tipo=val("ep_tipo"),data=val("ep_data"),obs=val("ep_obs");
  if(eventoId){const m=pt.manejos.find(x=>x.id===eventoId);if(m){m.tipo=tipo;m.data=data;m.obs=obs;}}
  else pt.manejos.push({id:uid(),tipo,data,obs,criadoEm:Date.now()});
  await put("pastos",pt);fechar();verPasto(pastoId);
}
async function excluirEventoPasto(pastoId,eventoId){
  if(!confirm("Excluir este evento do histórico?"))return;
  const pt=await get("pastos",pastoId);
  pt.manejos=(pt.manejos||[]).filter(m=>m.id!==eventoId);
  await put("pastos",pt);verPasto(pastoId);
}
/* ---------- Editar/excluir situações (períodos) ---------- */
async function editarPeriodoPasto(pastoId,ref){
  const pt=await get("pastos",pastoId);
  const {lotes}=await tudo();
  const aberto=(ref==="atual");
  const per=aberto?{status:pt.status||"Livre",inicio:pt.statusDesde||pt.criadoEm||Date.now(),fim:null,loteId:pt.loteId||null}:(pt.historico||[])[Number(ref)];
  if(!per){verPasto(pastoId);return;}
  const optStatus=["Livre","Descanso","Ocupado"].map(s=>`<option value="${s}" ${per.status===s?"selected":""}>${s}</option>`).join("");
  const optLote=`<option value="">— nenhum —</option>`+lotes.map(l=>`<option value="${l.id}" ${per.loteId===l.id?"selected":""}>${esc(l.nome)}</option>`).join("");
  abrir(`<h2>Editar situação</h2>
    <label>Situação</label><select id="pp_status">${optStatus}</select>
    <label>Lote (se ocupado)</label><select id="pp_lote">${optLote}</select>
    <label>Início</label><input id="pp_ini" type="date" value="${tsData(per.inicio)}">
    ${aberto?`<div class="meta" style="margin-top:10px">Fim: <b>em aberto (agora)</b> — é a situação atual do pasto.</div>`:`<label>Fim</label><input id="pp_fim" type="date" value="${per.fim?tsData(per.fim):hoje()}">`}
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarPeriodoPasto('${pastoId}','${ref}')">Salvar</button></div>`);
}
async function salvarPeriodoPasto(pastoId,ref){
  const pt=await get("pastos",pastoId);
  const status=val("pp_status");
  const loteId=status==="Ocupado"?(val("pp_lote")||null):null;
  const ini=dataParaTs(val("pp_ini"));
  if(ref==="atual"){
    pt.status=status;pt.loteId=loteId;if(ini)pt.statusDesde=ini;
  }else{
    const i=Number(ref);const arr=pt.historico||[];
    if(arr[i]){const fim=dataParaTs(val("pp_fim"));
      if(ini&&fim&&fim<ini){alert("A data de fim não pode ser anterior ao início.");return;}
      arr[i]={status,inicio:ini,fim,loteId};pt.historico=arr;}
  }
  await put("pastos",pt);fechar();verPasto(pastoId);
}
async function excluirPeriodoPasto(pastoId,ref){
  if(ref==="atual")return;
  if(!confirm("Excluir este período do histórico? Os dias contados serão recalculados."))return;
  const pt=await get("pastos",pastoId);
  const i=Number(ref);
  if((pt.historico||[])[i]){pt.historico.splice(i,1);await put("pastos",pt);}
  verPasto(pastoId);
}

          <div class="meta" style="color:${cor}">🍼 Desmama ${txt} · nasc. ${fmt(x.a.dataNascimento)}</div></div>`;
      }).join("")

    .sort((x,y)=>(x.data||"").localeCompare(y.data||"")||(x.hora||"").localeCompare(y.hora||""));
  const hojeTs=dataParaTs(hoje());
  const itensAviso=avisosCustom.map(a=>{
    const d=dataParaTs(a.data)!=null?Math.round((dataParaTs(a.data)-hojeTs)/86400000):null;
    const quando=d==null?"":(d>1?`em ${d} dias`:(d===1?"amanhã":(d===0?"hoje":`atrasado há ${-d} dia(s)`)));
    const cor=d==null?"var(--muted)":(d<0?"#c0392b":(d===0?"#b8860b":"var(--muted)"));
    return `<div class="card"><div class="row"><div class="ti" style="font-size:15px">${ICONE_AVISO[a.tipo]||"🔔"} ${esc(a.tipo)}</div>

      ${a.detalhe?`<div class="meta">${esc(a.detalhe)}</div>`:""}
      <div class="meta" style="color:${cor};font-weight:600">📅 ${fmt(a.data)}${a.hora?` · ${esc(a.hora)}`:""}${quando?` · ${quando}`:""}</div>
      <button class="btn-fant" style="padding:6px 0 0;color:var(--verde);font-weight:600" onclick="marcarAvisoFeito('${a.id}')">✓ Marcar como concluído</button></div>`;

  const blocoEventos=`<div class="h3">📌 Próximos eventos</div>`+(itensAviso.length

    : `<div class="meta" style="padding:2px 4px 4px">Nenhum evento cadastrado. Toque em "+ Cadastrar aviso".</div>`);

  const ed=aviso||null;

async function formEditarAviso(id){const a=await get("avisos",id);if(a)formNovoAviso(a);}
async function salvarAviso(id){
  const tipo=val("av_tipo"), det=val("av_det"), data=val("av_data"), hora=val("av_hora");
  if(!det)return alert("Descreva o aviso.");
  if(!data)return alert("Escolha a data do evento.");
  if(id){const a=await get("avisos",id);if(a){a.tipo=tipo;a.detalhe=det;a.data=data;a.hora=hora;a.notificadoEm=null;await put("avisos",a);}}
  else await put("avisos",{id:uid(),tipo,detalhe:det,data,hora,feito:false,notificadoEm:null,criadoEm:Date.now()});
  fechar();telaAvisos();
}
async function excluirAviso(id){if(!confirm("Excluir este aviso?"))return;await del("avisos",id);telaAvisos();}
async function marcarAvisoFeito(id){const a=await get("avisos",id);if(a){a.feito=true;a.feitoEm=Date.now();await put("avisos",a);}telaAvisos();}
async function ativarNotificacoes(){
  if(!("Notification" in window))return alert("Este aparelho não suporta notificações no navegador.");
  try{const p=await Notification.requestPermission();
    if(p==="granted"){alert("Lembretes ativados! Ao abrir o app, você será avisado dos eventos do dia.");checarNotificacoes();}
    else alert("Permissão não concedida. Você ainda vê os eventos aqui na lista.");
  }catch(e){alert("Não foi possível ativar as notificações neste aparelho.");}
  telaAvisos();
}
async function checarNotificacoes(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  const hojeStr=hoje(); const hojeTs=dataParaTs(hojeStr);
  const avisos=await getAll("avisos");
  const devidos=avisos.filter(a=>!a.feito&&dataParaTs(a.data)<=hojeTs&&a.notificadoEm!==hojeStr);
  if(!devidos.length)return;
  for(const a of devidos){a.notificadoEm=hojeStr;await put("avisos",a);}
  const corpo=devidos.map(a=>`${ICONE_AVISO[a.tipo]||"•"} ${a.tipo}: ${a.detalhe}`).join("\n");
  const titulo=devidos.length>1?`${devidos.length} avisos para hoje`:"Aviso do rebanho";
  try{
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    const opts={body:corpo,icon:"icon-192.png",badge:"icon-192.png",tag:"avisos-rebanho"};
    if(reg&&reg.showNotification)await reg.showNotification(titulo,opts);
    else new Notification(titulo,opts);
  }catch(e){}
}

async function telaLotes(){
  topoPagina();
  const {propriedades,lotes,animais}=await tudo();
  const conta=id=>animais.filter(a=>a.loteAtualId===id&&a.status==="Ativo").length;
  let html=`<button class="btn" onclick="formNovoLote()">+ Novo lote</button>`;
  if(lotes.length===0){html+=`<div class="vazio"><div class="big">▤</div><b>Nenhum lote</b><div class="meta">Crie um lote para organizar o rebanho.</div></div>`;}
  else{
    for(const p of propriedades){
      const ls=lotes.filter(l=>l.propriedadeId===p.id);if(!ls.length)continue;
      html+=`<div class="h3">${esc(p.nome)}</div>`;
      for(const l of ls)html+=`<div class="card row rt" onclick="verLote('${l.id}')">
        <div><div class="ti">${esc(l.nome)}</div>${l.descricao?`<div class="meta">${esc(l.descricao)}</div>`:""}</div>
        <span class="badge">${conta(l.id)} 🐄</span></div>`;
    }
    const orfaos=lotes.filter(l=>!propriedades.find(p=>p.id===l.propriedadeId));
    if(orfaos.length){html+=`<div class="h3">Sem propriedade</div>`;
      for(const l of orfaos)html+=`<div class="card row rt" onclick="verLote('${l.id}')">
        <div class="ti">${esc(l.nome)}</div><span class="badge">${conta(l.id)} 🐄</span></div>`;}
  }

function filtrarAnimais(){
  if(!_dadosAnimais)return;
  const {animais,nomeLote,marcaSigla,medPorAnimal}=_dadosAnimais;
  const t=(val("busca")||"").toLowerCase();
  const fMarca=(document.getElementById("f_marca")||{}).value||"";
  const fMed=(document.getElementById("f_med")||{}).value||"";
  const fNasc=(document.getElementById("f_nasc")||{}).value||"";
  let limite=null;
  if(fNasc){const d=new Date();d.setMonth(d.getMonth()-Number(fNasc));limite=d.getTime();}
  const lista=animais.slice().sort((x,y)=>(x.codigo||0)-(y.codigo||0)).filter(a=>{
    if(t){const blob=((a.brinco||"")+" "+(a.nome||"")+" "+codAnimal(a)).toLowerCase();if(!blob.includes(t))return false;}
    if(fMarca){if(fMarca==="__sem"){if(a.marcaId)return false;}else if(a.marcaId!==fMarca)return false;}
    if(fMed){const s=medPorAnimal[a.id];if(!s||!s.has(fMed))return false;}
    if(limite!=null){if(!a.dataNascimento)return false;const dn=dataParaTs(a.dataNascimento);if(dn==null||dn<limite)return false;}
    return true;
  });
  const cont=document.getElementById("lista");
  if(cont)cont.innerHTML=lista.length?lista.map(a=>{a._marcaSigla=marcaSigla(a.marcaId);return linhaAnimal(a,nomeLote(a.loteAtualId),true);}).join(""):`<div class="meta" style="padding:12px 4px">Nenhum animal com esses filtros.</div>`;

function lerFotoRedimensionada(file,cb){
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;const max=400;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.82));};
    img.src=e.target.result;};
  rd.readAsDataURL(file);
}
function pickFoto(input){const f=input.files[0];if(!f)return;

async function finResumo(){
  topoPagina();
  _finAno=_finAno||String(new Date().getFullYear());
  const {propriedades,lotes,animais}=await tudo();
  const nomeProp=id=>(propriedades.find(p=>p.id===id)||{}).nome||"—";
  const propDoAnimal=a=>{const l=lotes.find(x=>x.id===a.loteAtualId);return l?l.propriedadeId:null;};
  const todos=await getAll("lancamentos");
  const anos=[...new Set(todos.map(l=>(l.data||"").slice(0,4)).filter(Boolean))];
  if(!anos.includes(_finAno))anos.push(_finAno);
  anos.sort().reverse();
  const lancs=todos.filter(l=>(l.data||"").slice(0,4)===_finAno&&(!_finProp||l.propriedadeId===_finProp));
  const rec=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.valor||0),0);
  const cpv=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.custo||0),0);
  const desp=lancs.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+(l.valor||0),0);
  const resultado=rec-cpv-desp;
  const aReceber=lancs.filter(l=>l.tipo==="receita"&&!l.pago).reduce((s,l)=>s+(l.valor||0),0);
  const aPagar=lancs.filter(l=>l.tipo==="despesa"&&!l.pago).reduce((s,l)=>s+(l.valor||0),0);
  // valor do rebanho (estoque) = custo de estoque dos animais ativos
  const valorRebanho=animais.filter(a=>a.status==="Ativo"&&(!_finProp||propDoAnimal(a)===_finProp))
    .reduce((s,a)=>s+(a.custoEstoque||0),0);
  const porMes=Array.from({length:12},()=>({rec:0,cust:0}));
  for(const l of lancs){const m=parseInt((l.data||"").slice(5,7),10)-1;if(m>=0&&m<12){
    if(l.tipo==="receita"){porMes[m].rec+=l.valor||0;porMes[m].cust+=l.custo||0;}
    else porMes[m].cust+=l.valor||0;}}
  const maxMes=Math.max(1,...porMes.map(m=>Math.max(m.rec,m.cust)));
  const chart=`<div class="fchart">${porMes.map((m,i)=>`<div class="fcol"><div class="fbars">
      <div class="fbar rec" style="height:${Math.round(m.rec/maxMes*100)}%"></div>
      <div class="fbar desp" style="height:${Math.round(m.cust/maxMes*100)}%"></div>
    </div><div class="flbl">${MESES_ABREV[i]}</div></div>`).join("")}</div>`;
  let porProp="";
  if(!_finProp){
    const map={};
    for(const l of lancs){const k=l.propriedadeId||"__";const v=l.tipo==="receita"?((l.valor||0)-(l.custo||0)):-(l.valor||0);map[k]=(map[k]||0)+v;}
    const linhas=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="card row" style="cursor:default"><div class="ti" style="font-size:15px">🏠 ${k==="__"?"Sem propriedade":esc(nomeProp(k))}</div><div style="font-weight:800;color:${v>=0?'var(--verde)':'var(--perigo)'}">${moeda(v)}</div></div>`).join("");
    porProp=`<div class="h3">Resultado por propriedade</div>${linhas||`<div class="meta">Sem lançamentos.</div>`}`;
  }
  const optProp=`<option value="">Todas as propriedades</option>`+propriedades.map(p=>`<option value="${p.id}" ${_finProp===p.id?"selected":""}>${esc(p.nome)}</option>`).join("");
  const optAno=anos.map(a=>`<option value="${a}" ${_finAno===a?"selected":""}>${a}</option>`).join("");
  $t.innerHTML=`${finHead()}${finTabsBar("resumo")}
    <div class="lado" style="margin-bottom:14px">
      <select onchange="_finProp=this.value;finResumo()">${optProp}</select>
      <select onchange="_finAno=this.value;finResumo()" style="max-width:110px">${optAno}</select>
    </div>
    <div class="fin-hero"><div class="lbl">Resultado de ${_finAno}${_finProp?" · "+esc(nomeProp(_finProp)):""} (competência)</div>
      <div class="num">${moeda(resultado)}</div>
      <div class="lbl" style="margin-top:2px">receita − CPV − despesas · ${resultado>=0?"lucro":"prejuízo"} no período</div></div>
    <div class="fin-cards">
      <div class="fin-c"><div class="cl">💰 Receita de vendas</div><div class="cv" style="color:var(--verde)">${moeda(rec)}</div></div>
      <div class="fin-c"><div class="cl">🐂 CPV (custo dos vendidos)</div><div class="cv" style="color:var(--perigo)">${moeda(cpv)}</div></div>
      <div class="fin-c"><div class="cl">🧾 Despesas</div><div class="cv" style="color:var(--perigo)">${moeda(desp)}</div></div>
      <div class="fin-c"><div class="cl">🐄 Valor do rebanho</div><div class="cv">${moeda(valorRebanho)}</div></div>
      <div class="fin-c"><div class="cl">⏳ A receber</div><div class="cv">${moeda(aReceber)}</div></div>
      <div class="fin-c"><div class="cl">📌 A pagar</div><div class="cv">${moeda(aPagar)}</div></div>
    </div>
    <button class="btn" onclick="formLancamento()">+ Novo lançamento</button>
    <div class="h3">Evolução mensal <span style="font-weight:400;font-size:12px;color:var(--muted)">· receita e custos+despesas</span></div>
    <div class="card" style="padding:10px">${chart}</div>
    ${porProp}`;
}

async function finLancamentos(){

  lancs.sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.criadoEm||0)-(a.criadoEm||0));
  const chip=(k,l)=>`<button class="btn-fant" style="padding:5px 12px;border:1.5px solid ${_finFiltro===k?'var(--verde)':'var(--linha)'};border-radius:20px;color:${_finFiltro===k?'var(--verde)':'var(--muted)'};font-weight:600" onclick="_finFiltro='${k}';finLancamentos()">${l}</button>`;

      <div class="meta">📅 ${fmt(l.data)}${l.propriedadeId?` · ${esc(nomeProp(l.propriedadeId))}`:""} · <span style="color:${l.pago?'var(--verde)':'#b8860b'};font-weight:600">${l.pago?"Pago":(l.tipo==="receita"?"A receber":"A pagar")}</span></div>

        <button class="btn-fant" style="padding:2px 10px 2px 0;color:var(--verde);font-weight:600" onclick="toggleLancPago('${l.id}')">${l.pago?"Marcar em aberto":"Marcar pago"}</button>
        <button class="btn-fant" style="padding:2px 8px;color:var(--verde)" onclick="formLancamento('${l.id}')">✎</button>

async function salvarLancamento(id){
  const tipo=val("lc_tipo"), categoria=val("lc_cat"), valor=numBR("lc_valor"), data=val("lc_data");

async function finRelatorios(){
  topoPagina();
  _finAno=_finAno||String(new Date().getFullYear());
  const {propriedades,lotes,animais}=await tudo();
  const propDoAnimal=a=>{const l=lotes.find(x=>x.id===a.loteAtualId);return l?l.propriedadeId:null;};
  const todos=await getAll("lancamentos");
  const lancs=todos.filter(l=>(l.data||"").slice(0,4)===_finAno&&(!_finProp||l.propriedadeId===_finProp));
  const rec=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.valor||0),0);
  const cpv=lancs.filter(l=>l.tipo==="receita").reduce((s,l)=>s+(l.custo||0),0);
  const desp=lancs.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+(l.valor||0),0);
  const resultado=rec-cpv-desp;
  const estoque=animais.filter(a=>a.status==="Ativo"&&(!_finProp||propDoAnimal(a)===_finProp)).reduce((s,a)=>s+(a.custoEstoque||0),0);
  const aReceber=todos.filter(l=>l.tipo==="receita"&&!l.pago&&(!_finProp||l.propriedadeId===_finProp)).reduce((s,l)=>s+(l.valor||0),0);
  const aPagar=todos.filter(l=>l.tipo==="despesa"&&!l.pago&&(!_finProp||l.propriedadeId===_finProp)).reduce((s,l)=>s+(l.valor||0),0);
  const linhaDRE=(lbl,v,cor)=>`<div class="card row" style="cursor:default"><div class="ti" style="font-size:14px">${lbl}</div><div style="font-weight:800;color:${cor||'var(--texto)'}">${moeda(v)}</div></div>`;
  const porCat=(tipo)=>{
    const map={};
    for(const l of lancs.filter(x=>x.tipo===tipo))map[l.categoria]=(map[l.categoria]||0)+(l.valor||0);
    const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
    if(!arr.length)return `<div class="meta" style="padding:2px 4px 8px">Sem ${tipo==="receita"?"receitas":"despesas"} no período.</div>`;
    const tot=arr.reduce((s,[,v])=>s+v,0);
    return arr.map(([c,v])=>`<div class="card row" style="cursor:default"><div class="ti" style="font-size:14px">${esc(c)}</div><div style="text-align:right"><div style="font-weight:800;color:${tipo==="receita"?'var(--verde)':'var(--perigo)'}">${moeda(v)}</div><div class="meta">${tot?Math.round(v/tot*100):0}%</div></div></div>`).join("");

  const razao=lancs.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(l=>`<div class="card" style="cursor:default">

    ${linhaDRE("Receita de vendas",rec,"var(--verde)")}
    ${linhaDRE("(−) CPV — custo dos vendidos",-cpv,"var(--perigo)")}
    ${linhaDRE("(=) Margem bruta do rebanho",rec-cpv,rec-cpv>=0?"var(--verde)":"var(--perigo)")}
    ${linhaDRE("(−) Despesas do período",-desp,"var(--perigo)")}
    ${linhaDRE("(=) Resultado",resultado,resultado>=0?"var(--verde)":"var(--perigo)")}

    ${linhaDRE("⏳ Clientes — a receber",aReceber)}
    ${linhaDRE("📌 Fornecedores — a pagar",aPagar)}
    <div class="h3">Receitas por categoria</div>${porCat("receita")}
    <div class="h3">Despesas por categoria</div>${porCat("despesa")}
    <div class="h3">Partidas do período (débito / crédito)</div>
    ${razao.length?verMais(razao,"lançamento(s)"):`<div class="meta" style="padding:2px 4px 8px">Sem lançamentos no período.</div>`}`;
}

async function salvarEdicaoPasto(id){
  const nome=val("pe_nome");if(!nome)return alert("Dê um nome ao pasto.");
  const pt=await get("pastos",id);
  const novoStatus=val("pe_status");
  const novoLote=novoStatus==="Ocupado"?(val("pe_lote")||null):null;
  // garante os campos de histórico em pastos antigos
  if(!pt.historico)pt.historico=[];
  if(pt.statusDesde==null)pt.statusDesde=pt.criadoEm||Date.now();
  // se a situação mudou, fecha o período atual e abre um novo
  if(novoStatus!==(pt.status||"Livre")){
    pt.historico.push({status:pt.status||"Livre",inicio:pt.statusDesde,fim:Date.now(),loteId:pt.loteId||null});
    pt.statusDesde=Date.now();
  }
  pt.propriedadeId=val("pe_prop");pt.nome=nome;pt.areaHa=numBR("pe_area");pt.tipoCapim=val("pe_capim");
  pt.status=novoStatus;pt.loteId=novoLote;
  await put("pastos",pt);fechar();telaGestaoPasto();
}
async function excluirPasto(id){
  const pt=await get("pastos",id);
  if(!confirm(`Apagar o pasto "${pt?pt.nome:""}"?`))return;
  await del("pastos",id);fechar();telaGestaoPasto();
}

async function salvarSaida(animalId){
  const id = animalId || (document.getElementById("s_animal")||{}).value;
  if(!id)return alert("Selecione o animal.");
  const tipo=val("s_tipo"), data=val("s_data"), hora=val("s_hora");
  let saida={tipo,data,hora}, det="";
  if(tipo==="Morte"){
    saida.causa=val("s_causa");
    det=`Causa: ${saida.causa||"não informada"}`;
  }else{
    const preco=numBR("s_preco"), bruto=numBR("s_bruto"), liq=numBR("s_liq"), cond=val("s_cond");
    const valorInformado=numBR("s_valor");
    const valorCalc=(preco!=null&&liq!=null)?preco*(liq/15):null;
    const valor=valorInformado!=null?valorInformado:valorCalc;
    saida={...saida,precoArroba:preco,pesoBruto:bruto,pesoLiquido:liq,condicoes:cond,valor};
    det=`@ ${preco!=null?moeda(preco):"—"} · bruto ${bruto??"—"}kg · líq ${liq??"—"}kg`+
        (valor!=null?` · total ${moeda(valor)}`:"")+(cond?` · ${cond}`:"");
  }
  await registrarEvento(id,tipo,data,det,{hora});   // já muda o status para Morto/Vendido
  const a=await get("animais",id); a.saida=saida; await put("animais",a);
  // Integração financeira: venda gera receita (competência) + CPV / baixa de estoque
  if(tipo==="Venda"&&saida.valor!=null){
    const forma=(document.getElementById("s_forma")||{}).value||"vista";
    const lote=a.loteAtualId?await get("lotes",a.loteAtualId):null;
    await put("lancamentos",{id:uid(),tipo:"receita",categoria:"Venda de animais",valor:saida.valor,

      data,descricao:`Venda ${rotulo(a)} ${codAnimal(a)}`,propriedadeId:lote?lote.propriedadeId:null,
      pago:forma==="vista",origem:"venda_animal",refId:id,criadoEm:Date.now()});
  }
  fechar(); irAba('animais');
}

  const nomeMed=id=>{const m=medicamentos.find(x=>x.id===id);return m?m.nome:"Medicamento não informado";};
  const gruposManejo=(tipo)=>{
    const evs=eventos.filter(e=>e.tipo===tipo).sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.hora||"").localeCompare(a.hora||"")||(b.criadoEm||0)-(a.criadoEm||0));
    const mapa=new Map();
    for(const e of evs){
      const chave=[e.tipo,e.data||"",e.hora||"",e.detalhes||"",e.medicamentoId||"",e.via||"",e.dose||""].join("|");
      if(!mapa.has(chave))mapa.set(chave,{...e,animalIds:[],eventoIds:[]});
      const g=mapa.get(chave);g.animalIds.push(e.animalId);g.eventoIds.push(e.id);
    }
    return [...mapa.values()];
  };
  const sec=(tipo,icone,titulo)=>{
    const grupos=gruposManejo(tipo);
    if(!grupos.length)return `<div class="manejo-sec"><div class="manejo-sec-head"><div class="manejo-sec-title">${icone} ${titulo}</div><span class="manejo-count">0</span></div><div class="meta">Nenhum registro ainda.</div></div>`;
    const regsArr=grupos.map(g=>{
      const nomes=g.animalIds.map(nomeAnimal);
      const quem=nomes.length<=3?nomes.map(esc).join(", "):`${nomes.slice(0,3).map(esc).join(", ")} +${nomes.length-3}`;
      let tituloReg="";
      let detalhe="";
      if(tipo==="Medicamento"){
        tituloReg=esc(nomeMed(g.medicamentoId));
        detalhe=[g.via?`Via: ${esc(g.via)}`:"",g.dose?`Dose: ${esc(g.dose)}`:"",g.detalhes?esc(g.detalhes):""].filter(Boolean).join(" · ");
      }else if(tipo==="Marcação"){
        tituloReg="Marcação realizada";
        detalhe=g.detalhes?esc(g.detalhes):"Sem observação";
      }else if(tipo==="Castração"){
        tituloReg="Castração";
        detalhe=g.detalhes?esc(g.detalhes):"";
      }else if(tipo==="Outro"){
        tituloReg=esc(g.detalhes||"Outro evento");
      }else{
        tituloReg=esc(g.detalhes||tipo);
      }
      const quando=`${fmt(g.data)}${g.hora?` · ${esc(g.hora)}`:""}`;
      const ctrl=tipo!=="Movimentação"?`<div style="margin-top:8px">
        <button class="btn-fant" style="padding:2px 10px 2px 0;color:var(--verde);font-weight:600" onclick="editarGrupoManejo('${tipo}','${g.eventoIds.join(",")}')">✎ Editar</button>
        <button class="btn-fant" style="padding:2px 6px;color:var(--perigo)" onclick="excluirGrupoManejo('${tipo}','${g.eventoIds.join(",")}')">✕ Excluir</button></div>`:"";
      return `<div class="manejo-reg"><div class="mr-top"><div class="mr-title">${tituloReg}</div><div class="mr-date">${quando}</div></div><div class="mr-meta">${quem}${detalhe?`<br>${detalhe}`:""}</div>${ctrl}</div>`;
    });
    return `<div class="manejo-sec"><div class="manejo-sec-head"><div class="manejo-sec-title">${icone} ${titulo}</div><span class="manejo-count">${grupos.length}</span></div>${verMais(regsArr,"registro(s)")}</div>`;
  };
  $t.innerHTML=`<button class="voltar" onclick="irAba('painel')">‹ Painel</button>
    <div class="sechead"><span class="sic">☑</span><h2>Manejo</h2></div>
    <div class="meta" style="margin:0 4px 14px">Escolha a ação — depois você aplica a um animal ou a um lote inteiro.</div>
    <div class="mod-list">
    ${mod("🔥","Marcar animais","Registrar marcação (ferro).","formManejo('Marcação')")}
    ${mod("💊","Medicamento aplicado","Injeção, pour on, spray, brinco, ingestão…","formManejo('Medicamento')")}
    ${mod("↷","Trocar de lote","Mover um animal ou o lote inteiro.","formManejo('Movimentação')")}
    ${mod("✂️","Outros","Castração e outros eventos de manejo.","formManejo('Outros')")}
    </div>
    <div class="manejo-hist">
      <div class="sechead"><span class="sic">🗂</span><h2>Histórico de manejo</h2></div>
      ${sec("Medicamento","💊","Medicações realizadas")}
      ${sec("Marcação","🔥","Marcações de animais")}
      ${sec("Movimentação","↷","Trocas de lote")}
      ${sec("Castração","✂️","Castrações")}
      ${sec("Outro","📌","Outros eventos")}
    </div>`;
}
async function formManejo(tipo){
  const {propriedades,lotes,animais,medicamentos}=await tudo();
  if(!lotes.length){fechar();return alert("Cadastre lote e animais primeiro.");}
  const ativos=animais.filter(a=>a.status==="Ativo").sort((x,y)=>(x.codigo||0)-(y.codigo||0));
  const nomeLote=id=>(lotes.find(l=>l.id===id)||{}).nome||"—";
  const optAnimais=ativos.map(a=>`<option value="${a.id}">${esc(rotulo(a))} ${codAnimal(a)} — ${esc(nomeLote(a.loteAtualId))}</option>`).join("");
  const optLotes=lotes.map(l=>{const p=propriedades.find(x=>x.id===l.propriedadeId);return`<option value="${l.id}">${esc(l.nome)}${p?` — ${esc(p.nome)}`:""}</option>`;}).join("");
  let especifico="";
  if(tipo==="Medicamento"){
    const optMed=medicamentos.length
      ? medicamentos.map(m=>`<option value="${m.id}">${esc(m.nome)}${m.marca?` · ${esc(m.marca)}`:""}</option>`).join("")
      : `<option value="">— nenhum cadastrado —</option>`;
    especifico=`<label>Medicamento${medicamentos.length?"":" (cadastre em + → Cadastrar medicamento)"}</label>
      <select id="mj_med">${optMed}</select>
      <label>Via de aplicação</label><select id="mj_via">${VIAS.map(v=>`<option value="${v}">${v}</option>`).join("")}</select>
      <label>Dose (opcional)</label><input id="mj_dose" placeholder="Ex: 5 ml">
      <label>Observação (opcional)</label><input id="mj_obs">`;
  }else if(tipo==="Marcação"){
    especifico=`<label>Observação (opcional)</label><input id="mj_obs" placeholder="Ex: ferro IJG, mossa…">`;
  }else if(tipo==="Movimentação"){
    especifico=`<label>Lote de destino *</label><select id="mj_destino">${optLotes}</select>`;
  }else if(tipo==="Outros"){
    especifico=`<label>Tipo do evento</label>
      <select id="mj_sub" onchange="toggleOutro()">
        <option value="Castração">Castração (somente machos)</option>
        <option value="Outro">Outro (especificar)</option>
      </select>
      <div id="grp_outro" style="display:none"><label>Qual evento? *</label><input id="mj_qual" placeholder="Ex: descorna, exame, pesagem…"></div>
      <label>Observação (opcional)</label><input id="mj_obs">`;
  }
  const titulo=tipo==="Movimentação"?"Trocar de lote":(tipo==="Marcação"?"Marcar animais":(tipo==="Outros"?"Outros eventos":"Medicamento aplicado"));
  abrir(`<h2>${titulo}</h2>
    <label>Aplicar a</label>
    <select id="mj_alvo" onchange="toggleAlvo()">
      <option value="animal">Um animal específico</option>
      <option value="lote">Lote inteiro</option></select>
    <div id="grp_animal"><label>Animal</label><select id="mj_animal">${optAnimais||`<option value="">— nenhum animal ativo —</option>`}</select></div>
    <div id="grp_lote" style="display:none"><label>Lote</label><select id="mj_lote">${optLotes}</select></div>
    <label>Data e hora</label>
    <div class="lado"><input id="mj_data" type="date" value="${hoje()}"><input id="mj_hora" type="time" value="${horaAgora()}"></div>
    ${especifico}
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarManejo('${tipo}')">Registrar</button></div>`);
}
function toggleAlvo(){
  const lote=document.getElementById("mj_alvo").value==="lote";
  document.getElementById("grp_animal").style.display=lote?"none":"block";
  document.getElementById("grp_lote").style.display=lote?"block":"none";
}
function toggleOutro(){
  const el=document.getElementById("grp_outro");
  if(el)el.style.display=(document.getElementById("mj_sub").value==="Outro")?"block":"none";
}
async function salvarManejo(tipo){
  const alvo=document.getElementById("mj_alvo").value;
  const data=val("mj_data"), hora=val("mj_hora");
  const todos=await getAll("animais");
  let lista=[];
  if(alvo==="animal"){
    const id=(document.getElementById("mj_animal")||{}).value;
    if(!id)return alert("Selecione o animal.");
    lista=[id];
  }else{
    const loteId=(document.getElementById("mj_lote")||{}).value;
    lista=todos.filter(a=>a.loteAtualId===loteId&&a.status==="Ativo").map(a=>a.id);
    if(!lista.length)return alert("Esse lote não tem animais ativos.");
  }
  let n=0;
  if(tipo==="Movimentação"){
    const destino=val("mj_destino");
    const lotes=await getAll("lotes");
    const nomeLote=id=>(lotes.find(l=>l.id===id)||{}).nome||"—";
    const nomeDest=nomeLote(destino);
    for(const id of lista){
      const a=await get("animais",id);
      if(a.loteAtualId===destino)continue;
      const de=nomeLote(a.loteAtualId);
      a.loteAtualId=destino;await put("animais",a);
      await registrarEvento(id,"Movimentação",data,`De "${de}" para "${nomeDest}"`,{hora});n++;
    }
    if(!n){fechar();return alert("Os animais já estão nesse lote.");}
  }else if(tipo==="Marcação"){
    const obs=val("mj_obs");
    for(const id of lista){await registrarEvento(id,"Marcação",data,obs,{hora});n++;}
  }else if(tipo==="Medicamento"){
    const medId=(document.getElementById("mj_med")||{}).value||null;
    const via=val("mj_via"), dose=val("mj_dose"), obs=val("mj_obs");
    for(const id of lista){await registrarEvento(id,"Medicamento",data,obs,{hora,medicamentoId:medId,via,dose});n++;}
  }else if(tipo==="Outros"){
    const sub=(document.getElementById("mj_sub")||{}).value||"Castração";
    const obs=val("mj_obs");
    if(sub==="Castração"){
      for(const id of lista){const a=await get("animais",id);if(!a||a.sexo!=="M")continue;a.castrado=true;a.dataCastracao=data;await put("animais",a);await registrarEvento(id,"Castração",data,obs,{hora});n++;}
      if(!n){fechar();return alert("Nenhum macho entre os selecionados para castrar.");}
    }else{
      const qual=val("mj_qual");if(!qual)return alert("Descreva qual foi o evento.");
      const det=[qual,obs].filter(Boolean).join(" · ");
      for(const id of lista){await registrarEvento(id,"Outro",data,det,{hora});n++;}
    }
  }
  fechar();render();alert(`Registrado em ${n} animal(is).`);
}
async function editarGrupoManejo(tipo,idsCsv){
  const ids=idsCsv.split(",");
  const ev=await get("eventos",ids[0]); if(!ev){telaManejo();return;}
  const medicamentos=await getAll("medicamentos");
  let campos="";
  if(tipo==="Medicamento"){
    const optMed=(medicamentos.map(m=>`<option value="${m.id}" ${ev.medicamentoId===m.id?"selected":""}>${esc(m.nome)}${m.marca?` · ${esc(m.marca)}`:""}</option>`).join(""))||`<option value="">— nenhum —</option>`;
    campos=`<label>Medicamento</label><select id="em_med">${optMed}</select>
      <label>Via de aplicação</label><select id="em_via">${VIAS.map(v=>`<option value="${v}" ${ev.via===v?"selected":""}>${v}</option>`).join("")}</select>
      <label>Dose (opcional)</label><input id="em_dose" value="${esc(ev.dose||"")}">
      <label>Observação (opcional)</label><input id="em_obs" value="${esc(ev.detalhes||"")}">`;
  }else if(tipo==="Outro"){
    campos=`<label>Descrição do evento *</label><input id="em_det" value="${esc(ev.detalhes||"")}">`;
  }else{
    campos=`<label>Observação (opcional)</label><input id="em_obs" value="${esc(ev.detalhes||"")}">`;
  }
  abrir(`<h2>Editar registro</h2>
    <div class="meta" style="margin-bottom:10px">A alteração vale para os <b>${ids.length}</b> animal(is) deste registro.</div>
    ${campos}
    <label>Data e hora</label>
    <div class="lado"><input id="em_data" type="date" value="${ev.data||hoje()}"><input id="em_hora" type="time" value="${ev.hora||horaAgora()}"></div>
    <div class="lado" style="margin-top:18px"><button class="btn btn-sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarGrupoManejo('${tipo}','${idsCsv}')">Salvar</button></div>`);
}
async function salvarGrupoManejo(tipo,idsCsv){
  const ids=idsCsv.split(",");
  const patch={data:val("em_data"),hora:val("em_hora")};
  if(tipo==="Medicamento"){
    patch.medicamentoId=(document.getElementById("em_med")||{}).value||null;
    patch.via=val("em_via");patch.dose=val("em_dose");patch.detalhes=val("em_obs");
  }else if(tipo==="Outro"){
    const det=val("em_det");if(!det)return alert("Descreva o evento.");patch.detalhes=det;
  }else{
    patch.detalhes=val("em_obs");
  }
  for(const id of ids){const e=await get("eventos",id);if(!e)continue;Object.assign(e,patch);await put("eventos",e);}
  fechar();telaManejo();
}
async function excluirGrupoManejo(tipo,idsCsv){
  const ids=idsCsv.split(",");
  if(!confirm(`Excluir este registro? Ele será removido de ${ids.length} animal(is).`))return;
  for(const id of ids)await del("eventos",id);
  telaManejo();
}

async function dadosBackup(){
  const d={versao:5,exportadoEm:new Date().toISOString()};
  for(const s of["propriedades","marcas","lotes","animais","eventos","medicamentos","perfil","pastos","avisos","lancamentos"])d[s]=await getAll(s);

}
async function exportar(){
  const d=await dadosBackup();
  const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=`rebanho-backup-${hoje()}.json`;a.click();URL.revokeObjectURL(u);
  await marcarBackup();
}

async function getConfig(){return (await get("perfil","config"))||{id:"config"};}
async function marcarBackup(){const c=await getConfig();c.id="config";c.ultimoBackup=Date.now();await put("perfil",c);}
const diasDesde=ts=>ts?Math.floor((Date.now()-ts)/86400000):null;
async function salvarFreq(v){const c=await getConfig();c.id="config";c.lembreteDias=parseInt(v,10)||7;await put("perfil",c);}
/* --- Salvar na nuvem: abre o compartilhamento do iPhone (Salvar em Arquivos → iCloud) --- */
async function salvarNuvem(){
  const d=await dadosBackup();
  const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  const file=new File([blob],`rebanho-backup-${hoje()}.json`,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:"Backup do Rebanho"});
      await marcarBackup(); _lembreteOculto=true;
      if(aba==="perfil")telaPerfil(); else if(aba==="painel")telaPainel();
    }catch(e){/* usuário cancelou o compartilhamento */}
  }else{
    await exportar(); _lembreteOculto=true;
    alert("Seu navegador não abre o compartilhamento de arquivos. O backup foi baixado — mova para o iCloud Drive pelo app Arquivos.");
  }
}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);
    if(!confirm("Importar substitui TODOS os dados atuais. Continuar?"))return;
    for(const s of["propriedades","marcas","lotes","animais","eventos","medicamentos","perfil","pastos","avisos","lancamentos"]){
      for(const it of await getAll(s))await del(s,it.id);for(const it of(d[s]||[]))await put(s,it);}
    alert("Backup importado.");render();
  }catch(e){alert("Arquivo inválido.");}};r.readAsText(f);}
